name: trip_test_poc

# Proof-of-concept: runs Isca's existing trip_test comparison mechanism,
# but only on the test cases relevant to what actually changed (see
# ci/select_and_run_trip_tests.py), instead of the whole suite. No build
# caching or reduced resolution -- this is purely about test *selection*.
# Not intended as a long-term CI job on its own.

on:
  push:
    branches: [ ci_trip_test_poc ]
  workflow_dispatch:
    inputs:
      force_full_suite:
        description: 'Escape hatch: ignore selection, run every trip_test case'
        type: boolean
        default: false

env:
  GFDL_BASE: ${{ github.workspace }}
  GFDL_ENV: "ubuntu_conda"
  GFDL_WORK: "${{ github.workspace }}/../gfdl_work"
  GFDL_DATA: "${{ github.workspace }}/../gfdl_data"
  GFDL_PYDIR: "${{ github.workspace }}/src/extra/python"

jobs:
  trip_test_poc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # select_and_run_trip_tests.py needs real history to diff against
          # master's merge-base, not just the tip of this branch.
          fetch-depth: 0

      - name: Fetch master
        run: git fetch origin master:refs/remotes/origin/master

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          environment-file: ci/environment-py3.12_frozen.yml
          miniforge-version: "latest"
          use-mamba: true
          activate-environment: isca_env
          auto-activate-base: false

      - name: Install Isca python package
        shell: bash -l {0}
        run: |
          cd $GFDL_PYDIR
          python -m pip install -e .

      - name: Select and run relevant trip_test cases
        shell: bash -l {0}
        run: |
          echo "trip_test started: $(date -u)"
          FORCE_FLAG=""
          if [ "${{ inputs.force_full_suite }}" == "true" ]; then
            FORCE_FLAG="--force-full"
          fi
          python3 ci/select_and_run_trip_tests.py origin/master ${{ github.sha }} \
            $FORCE_FLAG \
            -n 2 \
            -r https://github.com/${{ github.repository }}
          echo "trip_test finished: $(date -u)"
